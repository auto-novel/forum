packages:
  - apps/admin
  - apps/web
  - packages/*

allowBuilds:
  esbuild: true
  vue-demi: true

catalog:
  '@types/node': ^24.12.2
  vite-plus: 1.7.0
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  typescript: 6.0.3

overrides:
  'vite@*': 'catalog:'
  # Keep Vitest's optional DOM peer on the workspace-compatible Node range.
  'jsdom@*': ^27.4.0
